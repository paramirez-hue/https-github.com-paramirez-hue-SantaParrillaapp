
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Santa Parrilla - Pedidos Online</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/metadata.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Santa Parrilla">
    <meta name="theme-color" content="#020617">
    
    <!-- Icono para iPhone / iPad -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1830/1830839.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Dancing+Script:wght@400..700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
            background-color: #F8F9FA;
            color: #0F172A;
        }
        .font-elegant { font-family: 'Playfair Display', serif; }
        .font-lettering { font-family: 'Dancing Script', cursive; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
        
        /* Glassmorphism Refined */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .glass-dark {
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Shadow Utilities */
        .shadow-premium {
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.1);
        }
        .shadow-orange-glow {
            box-shadow: 0 10px 25px -5px rgba(249, 115, 22, 0.4);
        }

        /* Animations */
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-scale { animation: fadeInScale 0.4s ease-out forwards; }
        
        .btn-press:active { transform: scale(0.96); }

        /* Brasas y Fuego */
        @keyframes sparkUp {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(var(--drift)) rotate(var(--rot)); opacity: 0; }
        }

        @keyframes fireGlow {
            0%, 100% { opacity: 0.3; transform: translate(-50%, 0) scale(1); }
            50% { opacity: 0.6; transform: translate(-50%, -5%) scale(1.1); }
        }

        @keyframes heatHaze {
            0%, 100% { filter: blur(80px) brightness(1); }
            50% { filter: blur(95px) brightness(1.2); }
        }

        .embers-container {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at bottom, #2a0a00 0%, #020617 80%);
            overflow: hidden;
            z-index: 0;
        }

        .spark {
            position: absolute;
            bottom: -20px;
            background: linear-gradient(to top, #ff9d00, #ff4d00);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(1px);
        }
    </style>
<script type="importmap">

  }
}
</script>
</head>
